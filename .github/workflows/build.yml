name: Maven Java 25 build

on:
  push:
    branches: ['codex/stage1-foundation']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile, test and package
        run: mvn --batch-mode --no-transfer-progress package
      - name: Save test plugin
        uses: actions/upload-artifact@v4
        with:
          name: InfectedMorph-test-jar
          path: target/InfectedMorph-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
